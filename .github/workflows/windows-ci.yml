name: Windows CI

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra vision --extra docs

      - name: Run tests
        run: uv run pytest -q -p no:cacheprovider --cov=src --cov-report=json --cov-report=xml

      - name: Enforce critical module coverage
        run: uv run python scripts/check_coverage_gates.py

      - name: Check all project types
        run: uv run mypy src

      - name: Enforce docstring coverage
        run: uv run interrogate src

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.json
            coverage.xml

      - name: Build distributable artifacts
        run: uv build --no-sources

      - name: Verify clean wheel installation
        run: uv run python scripts/smoke_wheel.py --wheel dist/multicad_mcp-0.5.0-py3-none-any.whl --work-dir "${{ runner.temp }}/multicad-wheel-smoke"

      - name: Check repository hygiene
        run: uv run python scripts/check_repository_hygiene.py

      - name: Run full Ruff checks
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Build documentation strictly
        run: uv run mkdocs build --strict
